name: Mise a jour automatique du Planning

on:
  schedule:
    # S'exécute tous les jours à minuit (Heure universelle)
    - cron: '0 0 * * *'
  # Le workflow_dispatch permet de lancer le script manuellement avec un bouton !
  workflow_dispatch: 

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Autorise le robot à modifier le fichier sorties.json

    steps:
      - name: 1. Récupérer le code du projet
        uses: actions/checkout@v4

      - name: 2. Préparer l'environnement Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Installer les outils
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: 4. Lancer le moteur d'extraction IGDB
        env:
          # Le robot récupère les clés dans le coffre-fort
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python moteur_igdb.py

      - name: 5. Sauvegarder et publier le nouveau planning
        run: |
          git config --global user.name 'Robot Projet P'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add sorties.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Actualisation automatique des dates" && git push)
