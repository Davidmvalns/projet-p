<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projet P - Planning JV</title>
    <style>
        :root {
            --bg-fond: #121212;
            --bg-carte: #1e1e1e;
            --texte-principal: #ffffff;
            --texte-secondaire: #a0a0a0;
            --accentuation: #00ffcc;
            --accent-nintendo: #e60012;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-fond);
            color: var(--texte-principal);
            margin: 0;
            padding: 20px;
        }

        header { text-align: center; margin-bottom: 30px; }
        h1 { margin: 0; font-size: 2.5em; text-transform: uppercase; letter-spacing: 2px;}
        .sous-titre { color: var(--texte-secondaire); font-weight: bold; }

        .filtres {
            display: flex; gap: 10px; justify-content: center; margin-bottom: 30px; flex-wrap: wrap;
        }
        
        button {
            background-color: var(--bg-carte); color: var(--texte-principal);
            border: 1px solid #333; padding: 10px 20px; border-radius: 20px;
            cursor: pointer; transition: all 0.2s; font-weight: bold;
        }

        button:hover, button.actif {
            border-color: var(--accentuation); color: var(--accentuation);
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
        }
        
        /* Couleur spécifique pour le bouton Nintendo quand il est actif */
        button[data-filtre="Nintendo"]:hover, button[data-filtre="Nintendo"].actif {
            border-color: var(--accent-nintendo); color: var(--accent-nintendo);
            box-shadow: 0 0 10px rgba(230, 0, 18, 0.2);
        }

        .recherche-conteneur { text-align: center; margin-bottom: 25px; }
        #barre-recherche {
            width: 90%; max-width: 500px; padding: 12px 20px; border-radius: 25px;
            background-color: var(--bg-carte); color: var(--texte-principal);
            border: 1px solid #333; font-size: 1rem; outline: none; transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #barre-recherche:focus { border-color: var(--accentuation); box-shadow: 0 0 15px rgba(0, 255, 204, 0.3); }
        
        .en-tete-carte { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .badge-rebours { 
            font-size: 0.75em; font-weight: bold; padding: 4px 8px; border-radius: 12px; 
            background-color: #333; color: #ddd; letter-spacing: 0.5px;
        }
        .badge-rebours.proche { background-color: var(--accent-nintendo); color: white; animation: pulse 2s infinite; }
        .badge-rebours.sorti { background-color: var(--accentuation); color: var(--bg-fond); }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(230, 0, 18, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(230, 0, 18, 0); }
            100% { box-shadow: 0 0 0 0 rgba(230, 0, 18, 0); }
        }

        .grille-jeux {
            display: grid; gap: 20px; max-width: 1200px; margin: 0 auto;
            grid-template-columns: 1fr;
        }

        @media (min-width: 600px) { .grille-jeux { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 900px) { .grille-jeux { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 1200px) { .grille-jeux { grid-template-columns: repeat(4, 1fr); } }

        .carte-jeu {
            background: var(--bg-carte); border-radius: 12px; overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: transform 0.2s;
            display: flex; flex-direction: column;
            animation: apparition 0.4s ease-out;
        }
        
        @keyframes apparition {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .carte-jeu:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0, 255, 204, 0.15); }

        .jaquette-conteneur {
            width: 100%; height: 350px; background-color: #2a2a2a;
            position: relative; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            text-align: center;
        }

        .jaquette-img {
            width: 100%; height: 100%; object-fit: cover;
            position: absolute; top: 0; left: 0; z-index: 2;
            background-color: #2a2a2a;
        }

        .jaquette-fallback {
            font-size: 1.3em; font-weight: bold; color: #666;
            padding: 20px; z-index: 1; text-transform: uppercase;
        }

        .infos { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }
        .date { color: var(--accentuation); font-weight: bold; font-size: 0.9em; margin-bottom: 8px; }
        .titre { margin: 0 0 10px 0; font-size: 1.2em; line-height: 1.3; }
        .plateforme { 
            font-size: 0.85em; color: var(--texte-secondaire); 
            margin-top: auto; padding-top: 10px; border-top: 1px solid #333;
        }
        .plateforme.nintendo { color: var(--accent-nintendo); }
        
        .loading { text-align: center; color: var(--texte-secondaire); font-style: italic; grid-column: 1 / -1; }

        .recherche-conteneur { text-align: center; margin-bottom: 25px; }
        .recherche-input {
            width: 100%; max-width: 400px; padding: 12px 20px;
            border-radius: 25px; border: 1px solid #333;
            background-color: var(--bg-carte); color: var(--texte-principal);
            font-size: 1em; transition: all 0.3s;
        }
        .recherche-input:focus {
            outline: none; border-color: var(--accentuation);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
        }
        .compte-a-rebours {
            display: inline-block; background-color: rgba(0, 255, 204, 0.1);
            color: var(--accentuation); padding: 6px 12px;
            border-radius: 8px; font-size: 0.85em; font-weight: bold;
            margin-top: 15px; align-self: flex-start;
        }
    </style>
</head>
<body>

    <header>
        <h1>Projet P</h1>
        <div class="sous-titre">Planning des sorties</div>
    </header>

    <div class="recherche-conteneur">
        <input type="text" id="barre-recherche" class="recherche-input" placeholder="🔍 Rechercher un jeu (ex: GTA, Witcher...)">
    </div>

    <!-- Ajout des attributs data-filtre pour la logique Javascript -->
    <div class="filtres">
        <button class="actif" data-filtre="Toutes les sorties">Toutes les sorties</button>
        <button data-filtre="PlayStation">PlayStation</button>
        <button data-filtre="Xbox">Xbox</button>
        <button data-filtre="Nintendo">Nintendo</button>
        <button data-filtre="PC">PC</button>
    </div>

    <div class="recherche-conteneur">
        <input type="text" id="barre-recherche" placeholder="Rechercher un jeu (ex: GTA, Witcher, Mario...)" autocomplete="off">
    </div>

    <main id="grille-jeux" class="grille-jeux">
        <div class="loading">Chargement des données satellites...</div>
    </main>

    <script>
        let tousLesJeux = []; // On stocke les jeux ici pour pouvoir les filtrer sans retélécharger le JSON
        let filtrePlateformeActuel = 'Toutes les sorties';
        let texteRechercheActuel = '';

        async function init() {
            try {
                // Détection de l'environnement de prévisualisation (iframe/blob) pour éviter l'erreur fetch
                if (window.location.protocol === 'blob:' || window.location.protocol === 'data:') {
                    throw new Error("Environnement de prévisualisation détecté.");
                }

                const reponse = await fetch('sorties.json');
                if (!reponse.ok) throw new Error("Impossible de charger sorties.json");
                
                tousLesJeux = await reponse.json();
                
            } catch (erreur) {
                console.warn(erreur.message + " Utilisation des données de secours.");
                // Données de secours intégrées
                tousLesJeux = [
                    { "titre": "007 First Light", "date": "30/09/2026", "timestamp": 1790726400, "plateforme": "Nintendo Switch 2", "jaquette": "https://placehold.co/600x800/1e1e1e/e60012?text=007+First+Light" },
                    { "titre": "Grand Theft Auto VI", "date": "24/10/2026", "timestamp": 1792756800, "plateforme": "PlayStation 5", "jaquette": "https://placehold.co/600x800/1e1e1e/00ffcc?text=GTA+VI" },
                    { "titre": "The Witcher 4 : Polaris", "date": "15/11/2026", "timestamp": 1794715200, "plateforme": "PC", "jaquette": "https://placehold.co/600x800/1e1e1e/00ffcc?text=The+Witcher+4" },
                    { "titre": "The Elder Scrolls VI", "date": "03/12/2026", "timestamp": 1796270400, "plateforme": "Xbox Series X|S", "jaquette": "https://placehold.co/600x800/1e1e1e/00ffcc?text=Elder+Scrolls+VI" }
                ];
            }
            
            afficherJeux(tousLesJeux);
            configurerFiltres();
            configurerRecherche();
        }

        function calculerRebours(timestamp) {
            const dateSortie = new Date(timestamp * 1000);
            const aujourdhui = new Date();
            
            // On remet les heures à zéro pour avoir une vraie différence en jours pleins
            dateSortie.setHours(0,0,0,0);
            aujourdhui.setHours(0,0,0,0);
            
            const differenceTemps = dateSortie.getTime() - aujourdhui.getTime();
            const differenceJours = Math.ceil(differenceTemps / (1000 * 3600 * 24));
            
            if (differenceJours === 0) return "⏳ Sort aujourd'hui !";
            if (differenceJours === 1) return "⏳ Sort demain !";
            if (differenceJours > 1) return `⏳ Sort dans ${differenceJours} jours`;
            if (differenceJours < 0) return `✅ Sorti il y a ${Math.abs(differenceJours)} jours`;
            return "";
        }

        function afficherJeux(jeuxData) {
            const conteneur = document.getElementById('grille-jeux');
            conteneur.innerHTML = ''; 

            if(jeuxData.length === 0) {
                conteneur.innerHTML = '<div class="loading">Aucun jeu ne correspond à vos critères.</div>';
                return;
            }

            jeuxData.forEach(jeu => {
                const article = document.createElement('article');
                article.className = 'carte-jeu';
                
                const classePlateforme = jeu.plateforme.includes('Nintendo') ? 'plateforme nintendo' : 'plateforme';
                const styleDate = jeu.plateforme.includes('Nintendo') ? `color: var(--accent-nintendo)` : '';
                const texteRebours = calculerRebours(jeu.timestamp);
                const classeReboursStyle = jeu.plateforme.includes('Nintendo') ? 'background-color: rgba(230, 0, 18, 0.1); color: var(--accent-nintendo);' : '';

                // Gestion blindée des images (firewall ou erreur réseau)
                let imageHtml = '';
                if (jeu.jaquette) {
                    // Si l'image est bloquée, 'onerror' la cache instantanément et dévoile le texte de secours
                    imageHtml = `<img src="${jeu.jaquette}" class="jaquette-img" alt="${jeu.titre}" onerror="this.style.display='none';">`;
                }

                article.innerHTML = `
                    <div class="jaquette-conteneur">
                        <span class="jaquette-fallback">${jeu.titre}</span>
                        ${imageHtml}
                    </div>
                    <div class="infos">
                        <div class="date" style="${styleDate}">${jeu.date}</div>
                        <h2 class="titre">${jeu.titre}</h2>
                        <div class="plateforme ${classePlateforme}">${jeu.plateforme}</div>
                        <div class="compte-a-rebours" style="${classeReboursStyle}">${texteRebours}</div>
                    </div>
                `;
                
                conteneur.appendChild(article);
            });
        }

        function appliquerFiltresGlobaux() {
            let jeuxFiltres = tousLesJeux;

            // 1. Filtrer par plateforme
            if (filtrePlateformeActuel !== 'Toutes les sorties') {
                jeuxFiltres = jeuxFiltres.filter(jeu => jeu.plateforme.includes(filtrePlateformeActuel));
            }

            // 2. Filtrer par recherche (texte)
            if (texteRechercheActuel.trim() !== '') {
                const rechercheMinuscule = texteRechercheActuel.toLowerCase();
                jeuxFiltres = jeuxFiltres.filter(jeu => 
                    jeu.titre.toLowerCase().includes(rechercheMinuscule)
                );
            }

            afficherJeux(jeuxFiltres);
        }

        function configurerRecherche() {
            const inputRecherche = document.getElementById('barre-recherche');
            inputRecherche.addEventListener('input', (e) => {
                texteRechercheActuel = e.target.value;
                appliquerFiltresGlobaux();
            });
        }

        function configurerFiltres() {
            const boutons = document.querySelectorAll('.filtres button');
            
            boutons.forEach(bouton => {
                bouton.addEventListener('click', (e) => {
                    // 1. On enlève la classe "actif" de tous les boutons
                    boutons.forEach(b => b.classList.remove('actif'));
                    // 2. On l'ajoute sur le bouton cliqué
                    e.target.classList.add('actif');
                    
                    // 3. On enregistre le filtre et on applique
                    filtrePlateformeActuel = e.target.getAttribute('data-filtre');
                    appliquerFiltresGlobaux();
                });
            });
        }

        init();
    </script>
</body>
</html>
